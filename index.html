<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media.net SSP · Publisher console (concept)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--card:#fff;--line:#E3E8EF;--ink:#17212F;--muted:#5F6C7E;--acc:#0B8A7E;--accd:#076B62;--acc2:#3A8DDE;--accbg:#E3F4F2;--bar:#BDE3EE;--good:#17784A;--goodbg:#E3F4EA;--warn:#94560A;--warnbg:#FFF1D9;--bad:#B1342B;--badbg:#FDE7E4;--hold:#AEB8C5}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;font:13.5px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.top{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;position:fixed;top:0;left:0;right:0;z-index:30}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;width:194px}
.logo .mk{width:24px;height:24px;border-radius:7px;background:var(--acc);display:grid;place-items:center;color:#fff;font-size:12px}
.logo small{font-weight:500;color:var(--muted);font-size:12.5px}
.acct{flex:1;display:flex;justify-content:center}
.acct button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-weight:500;cursor:pointer}
.tools{display:flex;gap:14px;align-items:center;color:var(--muted)}
.tools svg{width:18px;height:18px}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px}
.side{position:fixed;top:52px;left:0;bottom:0;width:200px;background:#fff;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;z-index:20}
.side button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.side button:hover{background:var(--bg);color:var(--ink)}
.side button.on{background:var(--accbg);color:var(--accd)}
.side svg{width:18px;height:18px;flex:none}
.side .sep{height:1px;background:var(--line);margin:8px 4px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:8px 10px;line-height:1.4}
main{position:fixed;top:52px;left:200px;right:0;bottom:0;padding:16px 22px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.fill{flex:1;min-height:0}
h1{font-size:21px;font-weight:600;margin:0}
h2{font-size:15px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hrow .sp{flex:1}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 0;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accd);border-color:var(--acc)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel>.ph{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.panel>.pb{flex:1;min-height:0;overflow:auto}
.panel>.pb.pad{padding:12px 16px}
.lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.big{font-size:22px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.chg{font-size:12.5px;font-weight:600}.up{color:var(--good)}.dn{color:var(--bad)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;font-weight:500;cursor:pointer;min-height:34px;white-space:nowrap}
.btn:hover{border-color:#C6CFDA}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--accd)}
.btn.sm{padding:3px 10px;min-height:28px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accbg);color:var(--accd)}
select,input[type=text],textarea{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff;min-height:34px}
textarea{width:100%;min-height:140px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.banner.off{background:#FFF8EA;border:1px solid #F4DDA9}.banner.live{background:var(--accbg);border:1px solid #B5E0DA}
.banner b{font-size:14px;margin-right:8px}
.bars{display:flex;align-items:flex-end;gap:4px;height:36px;margin-top:8px}
.bars i{flex:1;background:var(--bar);border-radius:3px 3px 0 0}.bars i:last-child{background:var(--acc2)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#FAFBFC;white-space:nowrap;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F8FAFC}
tr.sel td{background:var(--accbg)}
.meter{height:7px;background:#EDF1F5;border-radius:4px;overflow:hidden;min-width:60px}.meter i{display:block;height:100%;background:var(--acc)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:#EEF2F6;white-space:nowrap}
.chip.t{background:#E6F0FB;color:#1F5C9E}
.tier{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tier:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-Low{background:var(--goodbg);color:var(--good)}.t-Medium{background:var(--warnbg);color:var(--warn)}.t-High{background:var(--badbg);color:var(--bad)}
.st{font-size:12px;font-weight:600;white-space:nowrap}.st.on{color:var(--good)}.st.off{color:var(--muted)}.st.lab{color:var(--warn)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.url{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.empty p{max-width:520px}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prog{height:8px;background:#E8EDF2;border-radius:4px;overflow:hidden;flex:1;min-width:120px}.prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.drawer-bg{position:fixed;inset:0;background:rgba(15,23,35,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:#fff;z-index:41;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;overflow-y:auto;padding:18px 20px}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,35,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(920px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{width:min(520px,100%)}
.mhead{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mbody{padding:16px 20px}.mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.steps{display:flex;gap:8px;margin-bottom:14px}
.steps div{flex:1;border-top:3px solid var(--line);padding-top:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.steps div.on{border-color:var(--acc);color:var(--accd)}
.wiz{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px}
.opts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-bottom:8px}
.opts2 .opt{margin:0}
.opt.on{border-color:var(--acc);background:#F3FBFA}
.opt input{margin-top:3px;accent-color:var(--acc)}
.summary{background:var(--bg);border-radius:10px;padding:12px 14px}
.summary dt{font-size:12px;color:var(--muted)}.summary dd{margin:0 0 8px;font-weight:500}
.switch{position:relative;width:38px;height:21px;flex:none;display:inline-block}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:#C9D2DC;border-radius:11px;transition:.2s}
.switch span:after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--acc)}.switch input:checked+span:after{transform:translateX(17px)}
.switch input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.mock{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.mockbar{background:#F1F3F6;padding:6px 10px;display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--muted)}
.mockbar i{width:8px;height:8px;border-radius:50%;background:#D5DBE2;display:inline-block}
.mockbar em{font-style:normal;margin-left:6px;background:#fff;border-radius:6px;padding:1px 8px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mockbody{padding:10px 12px}.mockbody h4{margin:0 0 6px;font-size:13.5px;line-height:1.3}
.ln{height:7px;background:#EDF0F4;border-radius:4px;margin:5px 0}
.adslot{border:1px dashed #C9D2DC;border-radius:8px;padding:9px 11px;margin:8px 0;background:#FBFCFD}
.adslot small{color:var(--muted);font-size:11px}.adslot b{display:block;font-size:14.5px;margin:1px 0 4px}
.adslot.bad{border-color:#E8A49C;background:#FFF6F5}.adslot.good{border-color:#8ED0C7;background:#F4FBFA}
.why{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.why div{font-size:12.5px}.why b{display:block;font-size:13.5px}
pre{background:#0F1A26;color:#D7E3EE;border-radius:0;padding:12px 14px;font-size:11.5px;margin:0;min-height:100%}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:11px 15px;border-radius:10px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:380px}
.toast.show{opacity:1;transform:none}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.chart{position:relative;flex:1;min-height:150px;margin:6px 12px 8px}.chart svg{position:absolute;inset:0;width:100%;height:100%}
.log{padding:0 16px;margin:0}.log li{padding:8px 0;border-bottom:1px solid var(--line);list-style:none}
.hbar{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 5.5em;gap:10px;align-items:center;margin:6px 0;font-size:12.5px}
.lock{opacity:.55;filter:grayscale(.3)}
.kv{display:grid;grid-template-columns:9em minmax(0,1fr);gap:5px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.two{display:grid;gap:12px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.pv{display:grid;gap:12px;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
@media(max-height:700px),(max-width:1000px){body{overflow:auto}main{position:static;margin:52px 0 0 200px;overflow:visible}.fill{flex:none}.panel>.pb{max-height:420px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.pv{grid-template-columns:minmax(0,1fr);grid-template-rows:none}}
@media(max-width:760px){.side{width:60px}.side button span,.side .foot,.logo small{display:none}main{margin-left:60px!important;left:60px;padding:14px 12px}.logo{width:auto}.g2,.g3,.wiz,.opts2{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n>=1e7?(n/1e7).toFixed(2)+' Cr':n>=1e5?(n/1e5).toFixed(1)+' L':Math.round(n).toLocaleString('en-IN');
const inr=n=>'₹'+fmt(n);
const pct=(v,d=1)=>(v*100).toFixed(d)+'%';
const sgn=(v,d=1)=>(v>=0?'+':'')+(v*100).toFixed(d)+'%';
const ICON={
dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
inv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>',
ctx:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>'};

/* ---------- classifier ---------- */
const W=s=>s.split(' ');
const CATS={
'Food & Drink':W('recipe recipes paneer cook cooking curry masala butter tomato cream spices dish kadai garnish simmer grocery onion garlic ginger naan rice delicious sauce chilli coriander fridge breakfast poha oats sweets ladoo ghee dal biryani food chai cooker kitchen ingredients spicy'),
'Travel':W('travel flight flights airline airport hotel hotels resort beach goa trip holiday stay tourists destination booking metro commuters fares lounge miles abroad trains station'),
'Personal Finance':W('loan home emi interest rate rates lenders lender bank banks credit score tenure prepayment repo rbi balance transfer fees fee calculator fixed floating insurance tax savings sip invest deposit mutual funds premium policy claim card cards budget'),
'Sports > Cricket':W('cricket match century batter batting bowlers bowler wickets innings overs sixes boundaries captain league playoffs fantasy balls spinner team teams squad ipl auction season'),
'Technology > Mobile Phones':W('smartphone smartphones phone phones camera sensor display amoled battery charging processor gaming android storage ram'),
'Automotive':W('car cars suv engine mileage electric vehicle sedan showroom'),
'Health & Fitness':W('health diet doctor protein fitness exercise weight diabetes medication blood millet fibre calories conditions'),
'News > Politics':W('election rally parties party opposition voting polls minister government vote leader scheme contest welfare'),
'News > Accidents & Disasters':W('killed injured crash accident accidents wreckage debris emergency rescued rescue victims investigation regulator hospitals stranded diverted flood landslide displaced evacuated tragedy')};
const SENSITIVE=['Health & Fitness','News > Politics'];
const INTENTS={
'Food & Drink':[['buy fresh paneer online',.9],['grocery delivery in 10 minutes',.85],['best non-stick kadai',.75],['pressure cooker deals',.8],['diwali sweets gift box',.8],['instant poha and oats breakfast mix',.7]],
'Travel':[['cheap flights to goa',.9],['hotel deals this weekend',.85],['travel insurance for flight delays',.7],['metro card recharge',.5],['mumbai monsoon food tour',.4],['airport lounge access card',.8]],
'Personal Finance':[['lowest home loan interest rate',.95],['best travel credit card',.9],['best sip mutual funds',.85],['car loan interest rate',.85],['no cost emi phones',.8],['income tax calculator',.5],['check credit score free',.55]],
'Sports > Cricket':[['fantasy cricket team tips',.8],['cricket bat online',.6],['live cricket streaming',.5]],
'Technology > Mobile Phones':[['best phone under 30000',.9],['phone exchange offer',.85],['67w fast charger',.6]],
'Automotive':[['ev on-road price',.9],['car loan rates',.8]],
'Health & Fitness':[['health insurance for parents',.8],['diabetic friendly atta',.7]],
'News > Politics':[],
'News > Accidents & Disasters':[['latest news updates',.1]]};
const RISK_HIGH=W('killed dead death victims terror attack shooting bomb murder');
const RISK_MED=W('crash accident accidents injured tragedy debris emergency wreckage lawsuit scam fraud investigation stranded landslide displaced');
const POS=W('delicious brilliant thrilling excellent great best good perfect quick steady improves lower');
const NEG=W('killed injured crash stranded debris victims closed risk displaced landslide charges');
const STOP=new Set(W('the and for with this that from your into about then until more most they their them there than when which while will have been were also only just like over after before what some other each very much many such these those first next last best here keep check'));
const tok=t=>t.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
function analyze(text){
 const w=tok(text),cnt={};w.forEach(x=>cnt[x]=(cnt[x]||0)+1);const set=new Set(w);let tot=0;const raw={};
 for(const [c,l] of Object.entries(CATS)){raw[c]=l.reduce((s,x)=>s+(cnt[x]||0),0);tot+=raw[c]}
 const cats=Object.entries(raw).filter(([,v])=>v>0).map(([c,v])=>[c,v/tot]).sort((a,b)=>b[1]-a[1]).filter(([,v])=>v>=.15).slice(0,3);
 const hi=RISK_HIGH.filter(x=>set.has(x)),me=RISK_MED.filter(x=>set.has(x));
 const risk=hi.reduce((s,x)=>s+3*cnt[x],0)+me.reduce((s,x)=>s+cnt[x],0);
 const tier=risk>=7?'High':risk>=3?'Medium':'Low';
 const p=w.filter(x=>POS.includes(x)).length,n=w.filter(x=>NEG.includes(x)).length,s=(p-n)/(p+n+1);
 const dict=new Set(Object.values(CATS).flat());
 const keywords=Object.entries(cnt).filter(([x])=>x.length>=4&&!STOP.has(x)&&!/^\d+$/.test(x)).sort((a,b)=>(b[1]+(dict.has(b[0])?.5:0))-(a[1]+(dict.has(a[0])?.5:0))).slice(0,8).map(([x])=>x);
 const conf=cats.length?Math.min(.98,.42+cats[0][1]*.6):0;
 return{cats,tier,riskWords:[...hi,...me],sentiment:s>.2?'Positive':s<-.2?'Negative':'Neutral',keywords,conf,set:[...set]};
}
function intentsFor(L){

function topicStats(days,si){
 const m={};const sites=si.map(i=>SITES[i].id);
 for(const p of PAGES.filter(p=>sites.includes(p.site))){const L=eff(p),t0=L.cats[0]?L.cats[0][0]:'Unclassified',t=t0.startsWith('News')?'News':t0;const sp=PAGES.filter(q=>q.site===p.site).reduce((s,q)=>s+q.pv,0),sh=p.pv/sp,ix=[SITES.findIndex(s=>s.id===p.site)];
  const C=agg(days,ix,'c'),H=agg(days,ix,'h');m[t]=m[t]||{topic:t,imp:0,rev:0,cr:0,ci:0,hr:0,hi:0};
  m[t].imp+=(C.imp+H.imp)*sh;m[t].rev+=(C.rev+H.rev)*sh;m[t].cr+=C.rev*sh;m[t].ci+=C.imp*sh;m[t].hr+=H.rev*sh;m[t].hi+=H.imp*sh}
 return Object.values(m).map(r=>({...r,ec:r.ci?r.cr/r.ci*1000:0,eh:r.hi?r.hr/r.hi*1000:0})).sort((a,b)=>b.rev-a.rev);
}
function drawTrend(el){
 const si=el.dataset.si.split(',').map(Number),td=testDays();
 const pts=td.map(d=>{const C=agg([d],si,'c'),H=agg([d],si,'h');return{d,c:C.rev/C.pv*1000,h:H.rev/H.pv*1000}});
 const W=el.clientWidth,H=el.clientHeight;if(W<50||H<50)return;const l=46,r=26,t=10,b=26,lo=Math.min(...pts.map(p=>Math.min(p.c,p.h)))*.95,hi=Math.max(...pts.map(p=>Math.max(p.c,p.h)))*1.03;
 const X=i=>l+i*(W-l-r)/(pts.length-1),Y=v=>t+(1-(v-lo)/(hi-lo))*(H-t-b);
 const line=k=>pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1)).join(' ');
 const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily RPM: contextual is above holdout every day">${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E8EDF2"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#5F6C7E">₹${v.toFixed(0)}</text>`).join('')}
 ${pts.map((p,i)=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#5F6C7E">${dlabel(dates[p.d])}</text>`).join('')}
 <path d="${line('h')}" fill="none" stroke="#AEB8C5" stroke-width="2.5"/><path d="${line('c')}" fill="none" stroke="#0B8A7E" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.c)}" r="3.5" fill="#0B8A7E"/><circle cx="${X(i)}" cy="${Y(p.h)}" r="3" fill="#AEB8C5"/>`).join('')}</svg>`;
}

/* ---------- S9 settings ---------- */
function vSet(){
 return `<div class="hrow"><div><h1>Settings</h1><span class="small muted">Account, team and a log of every change</span></div></div>
 <div class="grid g2"><div class="card"><h2 style="margin-bottom:10px">Account</h2><dl class="kv"><dt>Publisher</dt><dd>Demo publisher network (sample)</dd><dt>Account ID</dt><dd>482910</dd><dt>Sites</dt><dd>${SITES.length}</dd><dt>Currency</dt><dd>INR (₹)</dd><dt>Contextual</dt><dd>${S.on?`On · ${S.cfg.safety} safety · labels shared: ${S.cfg.share?'yes':'no'}`:'Off'}</dd></dl></div>
 <div class="card"><h2 style="margin-bottom:10px">Team</h2><dl class="kv"><dt>Priya Nair</dt><dd>Yield manager · Admin</dd><dt>Arjun Mehta</dt><dd>Ad ops executive · Editor</dd><dt>Meera Iyer</dt><dd>Brand and editorial lead · Viewer</dd></dl></div></div>
 <div class="panel fill"><div class="ph"><h2>Activity log</h2><span class="small muted">${S.log.length} entries</span></div><div class="pb"><ul class="log">${S.log.map(l=>`<li><b>${esc(l.a)}</b><div class="small muted">${esc(l.u)} · ${esc(l.t)}</div></li>`).join('')}</ul></div></div>`;

/* ---------- modals ---------- */
const openModal=(html,sm)=>{$('#modal').className='modal'+(sm?' sm':'');$('#modal').innerHTML=html;$('#modalBg').classList.add('open');const f=$('#modal').querySelector('input,select,textarea,button.pri');f&&f.focus()};
const closeModal=()=>$('#modalBg').classList.remove('open');
function renderWizard(){
 const w=wiz,steps=['Choose sites','Safety and privacy','Test plan'];
 const nPages=PAGES.filter(p=>w.sites[p.site]).length*73;
 let body='';
 if(w.step===0)body=`<div class="row between" style="margin-bottom:8px"><p class="muted" style="margin:0">Pick where contextual targeting runs. Each page is read once; news pages refresh every 6 hours.</p><button class="btn sm" data-act="wall">${Object.values(w.sites).every(Boolean)?'Clear all':'Select all'}</button></div><div class="opts2">${SITES.map(s=>`<label class="opt ${w.sites[s.id]?'on':''}"><input type="checkbox" data-w="site" value="${s.id}" ${w.sites[s.id]?'checked':''}><div><b>${s.domain}</b><div class="small muted">${s.cat} · ~${(PAGES.filter(p=>p.site===s.id).length*73).toLocaleString('en-IN')} pages</div></div></label>`).join('')}</div>`;
 if(w.step===1)body=`<p class="muted" style="margin-top:0">Decide how careful ads should be on risky pages.</p>${[['Strict','No ads at all on high-risk pages (tragedy, disasters). Safest, earns least on news.'],['Moderate','Only news-safe buyers on high-risk pages; no shopping intent inferred there. Recommended.'],['Open','Buyers\' own settings decide. Earns most, more brand-safety risk.']].map(([k,d])=>`<label class="opt ${w.safety===k?'on':''}"><input type="radio" name="saf" data-w="safety" value="${k}" ${w.safety===k?'checked':''}><div><b>${k}</b><div class="small muted">${d}</div></div></label>`).join('')}
 <label class="opt ${w.sensitive?'on':''}"><input type="checkbox" data-w="sensitive" ${w.sensitive?'checked':''}><div><b>Don't infer shopping intent on sensitive topics</b><div class="small muted">Health, politics and religion pages are labelled by topic only.</div></div></label>
 <label class="opt ${w.share?'on':''}"><input type="checkbox" data-w="share" ${w.share?'checked':''}><div><b>Share labels with buyers in bid requests</b><div class="small muted">Lets every DSP bid on context. No user data is ever shared.</div></div></label>`;
 if(w.step===2)body=`<p class="muted" style="margin-top:0">Start with a test so you can see the real lift before going all in.</p><label class="lbl" for="split">Traffic with contextual targeting: <b id="splitv" style="color:var(--ink)">${w.split}%</b> (holdout ${100-w.split}%)</label><input id="split" type="range" min="50" max="95" step="5" value="${w.split}" data-w="split" style="width:100%;accent-color:var(--acc);margin:10px 0 16px">
 <dl class="kv"><dt>Test length</dt><dd>14 days</dd><dt>Success metric</dt><dd>RPM +3% or more vs holdout</dd><dt>Guardrails</dt><dd>Fill rate and brand safety no worse than holdout; page speed unaffected</dd></dl>`;
 const sum=`<div class="summary"><h3 style="margin-bottom:10px">Summary</h3><dl><dt>Sites</dt><dd>${SITES.filter(s=>w.sites[s.id]).map(s=>s.domain).join(', ')||'None selected'}</dd><dt>Pages to label</dt><dd>about ${nPages.toLocaleString('en-IN')}</dd><dt>Safety level</dt><dd>${w.safety}</dd><dt>Sensitive topics</dt><dd>${w.sensitive?'Topic only':'Full labels'}</dd><dt>Labels to buyers</dt><dd>${w.share?'Shared':'Not shared'}</dd><dt>Test</dt><dd>${w.split}% / ${100-w.split}%, 14 days</dd></dl></div>`;
 const none=!Object.values(w.sites).some(Boolean);
 openModal(`<div class="mhead"><h2>${S.on?'Contextual settings':'Enable contextual targeting'}</h2><button class="btn sm" data-act="closeModal" aria-label="Close">✕</button></div><div class="mbody"><div class="steps">${steps.map((s,i)=>`<div class="${i<=w.step?'on':''}">${i+1}. ${s}</div>`).join('')}</div><div class="wiz"><div>${body}${none&&w.step===0?'<p class="small" style="color:var(--bad)">Select at least one site.</p>':''}</div>${sum}</div></div>
 <div class="mfoot"><button class="btn" data-act="${w.step?'wback':'closeModal'}">${w.step?'Back':'Cancel'}</button><button class="btn pri" data-act="wnext" ${none?'disabled':''}>${w.step<2?'Next':S.on?'Save settings':'Start labelling'}</button></div>`);
}
function analyzeModal(){openModal(`<div class="mhead"><h2>Analyze a new page</h2><button class="btn sm" data-act="closeModal" aria-label="Close">✕</button></div><div class="mbody"><label class="lbl" for="anTitle">Page title</label><input id="anTitle" type="text" style="width:100%;margin:4px 0 12px" placeholder="e.g. 5 easy monsoon recipes"><label class="lbl" for="anSite">Site</label><br><select id="anSite" style="margin:4px 0 12px">${SITES.map(s=>`<option value="${s.id}">${s.domain}</option>`).join('')}</select><br><label class="lbl" for="anText">Article text</label><textarea id="anText" placeholder="Paste the article text here"></textarea><p id="anErr" class="small" style="color:var(--bad);min-height:1.2em;margin:6px 0 0"></p></div><div class="mfoot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="doAnalyze">Label this page</button></div>`,true)}
function formModal(kind){
 const f=kind==='site'?`<label class="lbl" for="fDomain">Domain</label><input id="fDomain" type="text" style="width:100%;margin:4px 0 12px" placeholder="example.com"><label class="lbl" for="fCat">Category</label><input id="fCat" type="text" style="width:100%;margin:4px 0" placeholder="e.g. Travel">`
 :`<label class="lbl" for="fName">Ad unit name</label><input id="fName" type="text" style="width:100%;margin:4px 0 12px" placeholder="e.g. Below article"><label class="lbl" for="fSize">Size</label><br><select id="fSize" style="margin:4px 0 12px"><option>300×250</option><option>728×90</option><option>320×50</option><option>300×600</option></select><br><label class="lbl" for="fFloor">Floor price (₹ CPM)</label><input id="fFloor" type="text" style="width:100%;margin:4px 0" value="50">`;
 openModal(`<div class="mhead"><h2>${kind==='site'?'Add site':'Add ad unit'}</h2><button class="btn sm" data-act="closeModal" aria-label="Close">✕</button></div><div class="mbody">${f}<p id="fErr" class="small" style="color:var(--bad);min-height:1.2em;margin:6px 0 0"></p></div><div class="mfoot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="${kind==='site'?'saveSite':'saveUnit'}">Save</button></div>`,true)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}
let timer;function startLabelling(){clearInterval(timer);S.progress=0;timer=setInterval(()=>{S.progress=Math.min(1,S.progress+.09);if(S.progress>=1){clearInterval(timer);toast('All pages labelled. Contextual ads are live.')}if(!$('#modalBg').classList.contains('open'))render()},700)}
async function copy(text,btn){try{await navigator.clipboard.writeText(text);btn.textContent='Copied'}catch(e){btn.textContent='Select and copy'}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-site],[data-page],[data-fsite]');if(!b)return;const d=b.dataset;
 if(d.nav){S.view=d.nav;closeDrawer();render();window.scrollTo(0,0);return}
 if(d.go){S.view=d.go;render();window.scrollTo(0,0);return}
 if(d.fsite){S.siteF=S.siteF===d.fsite?'all':d.fsite;render();return}
 if(d.mode){S.mode=d.mode;render();return}
 if(d.tab){S.ctxTab=d.tab;render();return}
 if(d.prev){const p=PAGES.find(x=>x.id===d.prev);S.prev={site:p.site,page:p.id,unit:UNITS.findIndex(u=>u.site===p.site&&u.name==='In-article')};S.view='ctx';S.ctxTab='preview';closeDrawer();render();window.scrollTo(0,0);return}
 if(d.site&&b.tagName==='TR'){S.selSite=d.site;render();return}
 if(d.page&&b.tagName==='TR'){openDrawer(d.page);return}
 const a=d.act;if(!a)return;
 if(a==='wizard'){wiz={step:0,...JSON.parse(JSON.stringify(S.cfg))};renderWizard()}
 if(a==='closeModal')closeModal();
 if(a==='wall'){const all=Object.values(wiz.sites).every(Boolean);SITES.forEach(s=>wiz.sites[s.id]=!all);renderWizard()}
 if(a==='wback'){wiz.step--;renderWizard()}
 if(a==='wnext'){if(wiz.step<2){wiz.step++;renderWizard();return}
  const first=!S.on;S.cfg={sites:wiz.sites,safety:wiz.safety,sensitive:wiz.sensitive,share:wiz.share,split:wiz.split};closeModal();
  if(first){S.on=true;addLog(`Enabled contextual targeting on ${SITES.filter(s=>S.cfg.sites[s.id]).map(s=>s.domain).join(', ')} (${S.cfg.split}/${100-S.cfg.split} test, ${S.cfg.safety} safety)`);S.view='ctx';S.ctxTab='pages';startLabelling();toast('Labelling started. Pages appear as they are read.')}
  else{addLog(`Changed contextual settings: ${S.cfg.safety} safety, ${S.cfg.split}/${100-S.cfg.split} split, label sharing ${S.cfg.share?'on':'off'}`);toast('Settings saved.')}
  render()}
 if(a==='closeDrawer')closeDrawer();
 if(a==='saveOv'){const p=PAGES.find(x=>x.id===d.id),t=$('#ovTopic').value,r=$('#ovTier').value;p.ov=t||r?{topic:t||null,tier:r||null}:null;addLog(`Edited labels on ${siteOf(p.site).domain}${p.path}${t?' · topic: '+t:''}${r?' · safety: '+r:''}`);toast('Labels saved. They will be kept on re-crawls.');render();openDrawer(p.id)}
 if(a==='clearOv'){const p=PAGES.find(x=>x.id===d.id);p.ov=null;addLog(`Reset labels to automatic on ${siteOf(p.site).domain}${p.path}`);render();openDrawer(p.id)}
 if(a==='recrawl'){const p=PAGES.find(x=>x.id===d.id);p.recrawl=true;toast('Re-crawl queued. Fresh labels in a few minutes.');openDrawer(p.id)}
 if(a==='analyze')analyzeModal();
 if(a==='doAnalyze'){const t=$('#anText').value.trim(),ti=$('#anTitle').value.trim()||'Untitled page',si=$('#anSite').value;if(t.split(/\s+/).length<15){$('#anErr').textContent='Paste at least 15 words of article text.';return}
  const id='p'+PAGES.length;PAGES.push({id,site:si,sec:'unknown',path:'/new/'+ti.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40),title:ti,pv:1000,text:t,L:analyze(t),ov:null,recrawl:false});
  if(!S.cfg.sites[si]||!S.on){toast('Page labelled. Turn contextual on for this site to use the labels.')}else toast('Page labelled.');addLog(`Analyzed new page "${ti}"`);closeModal();render();if(labelled(PAGES.at(-1)))openDrawer(id)}
 if(a==='copyRtb')copy($('#rtb').textContent,b);
 if(a==='csv'){const si=siteIdx(),td=[...Array(DAYS-TEST0)].map((_,i)=>TEST0+i),r=topicStats(td,si);copy('topic,impressions,net_revenue_inr,ecpm_contextual,ecpm_holdout\n'+r.map(x=>[x.topic,Math.round(x.imp),Math.round(x.rev),x.ec.toFixed(2),x.eh.toFixed(2)].join(',')).join('\n'),b)}
 if(a==='rollout'){S.rolled=true;addLog('Rolled out contextual targeting to 95% of traffic (5% permanent holdout)');toast('Rolled out to 95% of traffic.');render()}
 if(a==='addSite')formModal('site');if(a==='addUnit')formModal('unit');
 if(a==='saveSite'){const dm=$('#fDomain').value.trim();if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(dm)){$('#fErr').textContent='Enter a domain like example.com';return}SITES.push({...CATP.News,id:'s'+SITES.length,domain:dm,cat:$('#fCat').value.trim()||'Other',pv:0,req:0});addLog('Added site '+dm);closeModal();toast('Site added. Add the Media.net tag to start serving.');render()}
 if(a==='saveUnit'){const nm=$('#fName').value.trim(),fl=Number($('#fFloor').value);if(!nm||!(fl>0)){$('#fErr').textContent='Enter a name and a floor price above 0.';return}UNITS.push({site:S.selSite,name:nm,size:$('#fSize').value,place:'Article body',floor:fl,ctx:true});addLog(`Added ad unit "${nm}" on ${siteOf(S.selSite).domain}`);closeModal();render()}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.f){S[d.f]=d.f==='range'?Number(t.value):t.value;render()}
 if(d.pf&&d.pf!=='q'){S.pf[d.pf]=t.value;render()}
 if(d.pv){S.prev[d.pv]=d.pv==='unit'?Number(t.value):t.value;if(d.pv==='site'){S.prev.page=PAGES.find(p=>p.site===t.value).id;S.prev.unit=UNITS.findIndex(u=>u.site===t.value)}render()}
 if(d.unit){const u=UNITS[d.unit];u.ctx=t.checked;addLog(`Turned contextual ${t.checked?'on':'off'} for "${u.name}" on ${siteOf(u.site).domain}`);toast(`Contextual ${t.checked?'on':'off'} for ${u.name}.`)}
 if(d.w){if(d.w==='site')wiz.sites[t.value]=t.checked;else if(d.w==='safety')wiz.safety=t.value;else if(d.w==='split')wiz.split=Number(t.value);else wiz[d.w]=t.checked;renderWizard()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.pf==='q'){S.pf.q=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-pf="q"]');n.focus();n.setSelectionRange(pos,pos)}if(t.id==='split'){wiz.split=Number(t.value);$('#splitv').textContent=t.value+'%'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}if(e.key==='Enter'&&e.target.matches('tr.click')){e.target.click()}});
$('#drawerBg').addEventListener('click',closeDrawer);
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(after,150)});
render();
}
